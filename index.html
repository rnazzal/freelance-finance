<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Freelance Finance | Coming Soon</title>

  <meta name="robots" content="noindex, nofollow">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background:
        radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.10), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.08), transparent 35%),
        #07111f;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .brand {
      font-size: clamp(2.4rem, 7vw, 5.2rem);
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 1;
      margin-bottom: 28px;
    }

    .brand span {
      color: #38bdf8;
    }

    .line {
      width: 70px;
      height: 3px;
      margin: 0 auto 32px;
      background: #38bdf8;
      border-radius: 10px;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 500;
      margin-bottom: 20px;
    }

    p {
      max-width: 620px;
      margin: 0 auto;
      color: #aebdce;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    .coming-soon {
      display: inline-block;
      margin-top: 38px;
      padding: 11px 22px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 50px;
      color: #7dd3fc;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    footer {
      margin-top: 80px;
      color: #65758a;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">
      Freelance<span>Finance</span>
    </div>

    <div class="line"></div>

    <h1>We're building something new.</h1>

    <p>
      Our website is currently being updated.
      A new Freelance Finance experience is coming soon.
    </p>

    <div class="coming-soon">Coming Soon</div>

    <footer>
      &copy; 2026 Freelance Finance. All rights reserved.
    </footer>

  </main>

</body>
</html>
